name: splat-loc-sim-env

channels:
  - conda-forge

dependencies:
  - python=3.11
  - numpy
  - opencv
  - open3d
  - pip

  # r / r markdown
  - r-base
  - r-rmarkdown
  - r-knitr
  - pandoc

  # r packages
  - r-dplyr
  - r-ggplot2
  - r-zoo
  - r-tidyr

  # pdf export
  - tectonic

  # python pip packages
  - pip:
      - plyfile
      - dearpygui
      - pyyaml